# The trust ladder in CI: a change to a prompt or a policy value makes a new reviewer, so the
# planted-bug eval re-runs on it and the job shows which areas moved up or down a level. An area that
# drops fails the job: a prompt edit cannot quietly cost the reviewer trust it had earned. Needs the
# repository secret ANTHROPIC_API_KEY (spending limit set) and spends model credits, which is why it
# runs only when prompts or policy change, or by hand. The cheap check that the committed report card
# matches the committed runs is `pnpm evals --check` in ci.yml. docs/development.md, CI.
name: countersign-eval

on:
  pull_request:
    paths:
      - "src/prompts/**"
      - "src/policy/**"
  workflow_dispatch:

concurrency:
  group: countersign-eval-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  eval:
    # Fork PRs get no secrets, so they skip rather than fail.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      AI_BACKEND: api
      AI_MODE: record
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Skip without a key
        id: key
        shell: bash
        run: |
          # A job's env: may not use the runner context, so the clone's path is set here.
          echo "SAMPLE_REPO_DIR=$RUNNER_TEMP/fork" >> "$GITHUB_ENV"
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "No ANTHROPIC_API_KEY secret: the eval is skipped, so this prompt or policy change has no measured effect on the ladder." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.has_key == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.key.outputs.has_key == 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.key.outputs.has_key == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.key.outputs.has_key == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.key.outputs.has_key == 'true'
        run: pnpm seed

      - name: Keep the committed report card to compare against
        if: steps.key.outputs.has_key == 'true'
        run: cp data/eval/report-card.json "$RUNNER_TEMP/report-card.before.json"

      # Runs for the current reviewer version are reused, so only what the change made stale is re-recorded.
      - name: Planted-bug eval
        if: steps.key.outputs.has_key == 'true'
        run: pnpm evals

      - name: Levels before and after
        if: steps.key.outputs.has_key == 'true'
        shell: bash
        run: |
          set +e
          node .github/scripts/levelDiff.mjs "$RUNNER_TEMP/report-card.before.json" data/eval/report-card.json | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

      - name: Keep the new report card and runs
        if: always() && steps.key.outputs.has_key == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-card
          path: |
            data/eval/report-card.json
            data/runs/
          retention-days: 30

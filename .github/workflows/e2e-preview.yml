# Runs the Playwright demo path against a finished Vercel deployment, preview or production
# (docs/setup.md section 6). Informational: nothing requires it yet. A deployment_status run
# uses the workflow file of the deployed commit, so the job below holds secrets while running
# that commit's code. The gate step therefore only accepts a commit that is the head of a branch
# in this repository. This is not a boundary against people with write access: anyone who can
# push a branch can read secrets, as with any pull_request run in the same repository.
name: e2e-preview

on:
  deployment_status:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.deployment_status.environment_url }}
  cancel-in-progress: true

jobs:
  e2e:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      # Without its secrets the run cannot reach the site, so it says so and ends green:
      # an informational check that fails for a missing setting is noise.
      - name: Check the secrets this deployment needs
        id: gate
        env:
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          URL: ${{ github.event.deployment_status.environment_url }}
          SHA: ${{ github.event.deployment.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          ACCESS_CODE: ${{ secrets.ACCESS_CODE }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::The deployment reports no URL; nothing to test."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$(gh api "repos/$REPO/commits/$SHA/branches-where-head" --jq length)" = "0" ]; then
            echo "::notice::Skipped: $SHA is not the head of a branch in this repository, so secrets are not given to it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$BYPASS_SECRET" ]; then
            # Every environment_url is a *.vercel.app address, which Vercel Authentication covers.
            echo "::notice::Skipped: add the VERCEL_AUTOMATION_BYPASS_SECRET repository secret."
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$ENVIRONMENT" = "Production" ] && [ -z "$ACCESS_CODE" ]; then
            echo "::notice::Skipped: add the ACCESS_CODE repository secret (the production access gate is on)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
        with:
          ref: ${{ github.event.deployment.sha }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'

      - name: Cache Playwright browsers
        id: browsers
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # A cache hit restores the browser but not the system libraries it needs.
      - name: Install Chromium
        if: steps.gate.outputs.run == 'true'
        env:
          CACHE_HIT: ${{ steps.browsers.outputs.cache-hit }}
        run: |
          if [ "$CACHE_HIT" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      # Only real-data: the desktop and mobile projects assume fixture data, which exists only on
      # a local server. real-data reads the data/ checked out above, the commit the deployment
      # was built from, and also loads the inbox, review, report-card, receipt and dashboard screens.
      - name: Playwright
        if: steps.gate.outputs.run == 'true'
        env:
          E2E_BASE_URL: ${{ github.event.deployment_status.environment_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          # The gate is on in production only; an empty code makes the specs skip unlocking.
          ACCESS_CODE: ${{ github.event.deployment_status.environment == 'Production' && secrets.ACCESS_CODE || '' }}
        run: pnpm e2e --project=real-data

# One small live call through the Kimi backend (src/ai/canary.ts). It checks that the key, the
# endpoint, the model id and schema-valid output still work; it scores nothing and costs a fraction
# of a cent. Runs on pushes to main (never on pull requests: fork PRs get no secrets, and a PR
# author could print the key) and by hand. Informational: nothing requires it.
name: model-canary

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    # The key is an Environment secret of "ci", which a job reads only when it names the environment.
    environment: ci
    timeout-minutes: 5
    steps:
      # Without the secret the call cannot be made, so the run says so and ends green:
      # an informational check that fails for a missing setting is noise.
      - name: Check the secret this job needs
        id: gate
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_SECRET_KEY }}
        run: |
          if [ -z "$KIMI_API_KEY" ]; then
            echo "::notice::Skipped: add the KIMI_SECRET_KEY secret to the ci environment (a Verda inference key)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.gate.outputs.run == 'true'

      - name: Kimi canary
        if: steps.gate.outputs.run == 'true'
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_SECRET_KEY }}
        run: pnpm ai:canary

# One job, fail-fast order, target under 4 minutes (docs/setup.md section 6).
# The cheap checks that need no install-heavy work come first; the slow ones (lint to build)
# are skipped when a PR changes only Markdown, but the job still runs so the required
# `ci` check always reports. No `paths-ignore`: a required check that never runs blocks the PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the message and lane checks diff against origin/main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Untrusted PR text reaches the scripts only through env:, never through the shell line.
      - name: 0. Message check
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node .github/scripts/checkMessages.mjs

      - name: 1. Lane check
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node .github/scripts/checkLanes.mjs

      - name: 2. Tree check
        run: node .github/scripts/checkTree.mjs

      - name: 3. Hook, lane-logic and CI script tests
        run: |
          pnpm test:hooks
          node --test ".github/scripts/*.test.mjs"

      # Pushes to main always run the slow steps; a PR skips them when every changed file is Markdown.
      - name: Decide whether the slow steps run
        id: scope
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && ! git diff --name-only origin/main...HEAD | grep -qv '\.md$'; then
            echo "slow=false" >> "$GITHUB_OUTPUT"
            echo "Only Markdown changed: lint, typecheck, tests and build are skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "slow=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}

      - name: 4. Lint
        if: steps.scope.outputs.slow == 'true'
        run: pnpm lint

      - name: 4. Typecheck
        if: steps.scope.outputs.slow == 'true'
        run: pnpm typecheck

      - name: 4. Unit tests
        if: steps.scope.outputs.slow == 'true'
        run: pnpm test

      - name: 4. Build
        if: steps.scope.outputs.slow == 'true'
        run: pnpm build

      - name: 5. Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

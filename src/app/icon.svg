<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -3 30 30" fill="none">
  <!-- The Wordmark logo with the --logo-* token values inlined: a favicon has no page CSS to resolve var().
       The viewBox is padded to a square so browsers don't stretch it. The strong bar turns dark on light
       browser chrome, where the token's near-white would vanish. -->
  <style>
    .muted { fill: #6b7280; }
    .strong { fill: #f3f4f6; }
    .brace { stroke: #3d63f2; }
    @media (prefers-color-scheme: light) {
      .strong { fill: #111418; }
    }
  </style>
  <rect class="muted" x="1" y="3" width="13" height="3.2" rx="1.6"/>
  <rect class="strong" x="1" y="10.4" width="17.5" height="3.2" rx="1.6"/>
  <rect class="muted" x="1" y="17.8" width="10" height="3.2" rx="1.6"/>
  <path class="brace" d="M21.5 1.6c2.6 0 3.2 1.1 3.2 3.2v3.8c0 1.6.9 2.7 2.9 3.4-2 .7-2.9 1.8-2.9 3.4v3.8c0 2.1-.6 3.2-3.2 3.2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 408" width="880" height="408" role="img" aria-labelledby="signed-receipt-t signed-receipt-d"><title id="signed-receipt-t">Signed receipt: sign, store, verify</title><desc id="signed-receipt-d">At signing: git diff, its SHA-256, the receipt with what was checked, what wasn&#x27;t and the residual risk, signed with ssh-keygen and the owner&#x27;s key. At merge in CI: the git note is read, the signature is checked against allowed_signers and the diff hash is recomputed. Exit 0 merges; exit 2 no receipt, exit 3 signature invalid, exit 1 stale diff block the merge.</desc><style>
.frame{fill:#0d0f12;stroke:#262c34;stroke-width:1}
.node{fill:#111418;stroke:#2a3038;stroke-width:1.5}
.node-acc{fill:#111418;stroke:#93aaff;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#111418;stroke:#e2b04a;stroke-width:1.5}
.tint-amber{fill:#e2b04a;fill-opacity:.12}
.node-rose{fill:#111418;stroke:#ef7a85;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#2a3038;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#9aa3af}
.title{font-size:13px;font-weight:600;fill:#e6e8eb}
.heading{font-size:14px;font-weight:600;fill:#e6e8eb}
.secondary{fill:#9aa3af}
.code{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#c4cad3}
.accent-text{fill:#93aaff}.rose-text{fill:#ef7a85}
.ln{stroke:#9aa3af;stroke-width:1.5;fill:none}
.la{stroke:#93aaff;stroke-width:2;fill:none}
.lr{stroke:#ef7a85;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head-neutral{fill:#9aa3af}.head-accent{fill:#93aaff}.head-rose{fill:#ef7a85}
.badge-dot{fill:#3558e8}.badge-number{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#ef7a85;stroke-width:1.5}
</style><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-neutral"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-rose"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="407" rx="8"/><text x="32" y="34" class="heading">At signing, on the owner&#x27;s machine</text><rect class="node" x="32" y="48" width="180" height="72" rx="6"/><text x="46" y="80.5" class="title">git diff base..head</text><text x="46" y="98.5" class="secondary">fixed options, no user config</text><path class="ln" d="M214,84 L241,84" marker-end="url(#ah-neutral)"/><rect class="node" x="244" y="48" width="180" height="72" rx="6"/><text x="258" y="80.5" class="title">diffSha256</text><text x="258" y="98.5" class="secondary">SHA-256 of the diff bytes</text><path class="ln" d="M426,84 L453,84" marker-end="url(#ah-neutral)"/><rect class="node" x="456" y="48" width="180" height="72" rx="6"/><text x="470" y="72" class="title">Receipt</text><text x="470" y="90" class="secondary">checked · not checked</text><text x="470" y="107" class="secondary">residual risk</text><path class="ln" d="M638,84 L665,84" marker-end="url(#ah-neutral)"/><rect class="node-acc" x="668" y="48" width="180" height="72" rx="6"/><text x="682" y="80.5" class="title">ssh-keygen -Y sign</text><text x="682" y="98.5" class="secondary">the owner&#x27;s own SSH key</text><path class="la" d="M758,122 L758,150 L182,150 L182,189" marker-end="url(#ah-accent)"/><text x="32" y="180" class="heading">At merge, in CI</text><rect class="node" x="32" y="192" width="180" height="72" rx="6"/><text x="46" y="216" class="title">git note</text><text x="46" y="234" class="secondary">refs/notes/countersign</text><text x="46" y="251" class="secondary">append-only</text><path class="ln" d="M214,228 L241,228" marker-end="url(#ah-neutral)"/><rect class="node" x="244" y="192" width="180" height="72" rx="6"/><text x="258" y="224.5" class="title">Check the signature</text><text x="258" y="242.5" class="secondary">against allowed_signers</text><path class="la" d="M426,228 L453,228" marker-end="url(#ah-accent)"/><rect class="node" x="456" y="192" width="180" height="72" rx="6"/><text x="470" y="224.5" class="title">Recompute diffSha256</text><text x="470" y="242.5" class="secondary">same function as above</text><path class="la" d="M638,228 L665,228" marker-end="url(#ah-accent)"/><rect class="node-acc" x="668" y="192" width="180" height="72" rx="6"/><text x="682" y="216" class="title">exit 0: merge</text><text x="682" y="234" class="secondary">good signature,</text><text x="682" y="251" class="secondary">diff unchanged</text><path class="lr" d="M122,266 L122,300" marker-end="url(#ah-rose)"/><rect class="node-rose" x="32" y="304" width="180" height="48" rx="6"/><text x="48" y="332" class="code">exit 2</text><text x="102" y="332" class="rose-text">no receipt</text><path class="lr" d="M334,266 L334,300" marker-end="url(#ah-rose)"/><rect class="node-rose" x="244" y="304" width="180" height="48" rx="6"/><text x="260" y="332" class="code">exit 3</text><text x="314" y="332" class="rose-text">signature invalid</text><path class="lr" d="M546,266 L546,300" marker-end="url(#ah-rose)"/><rect class="node-rose" x="456" y="304" width="180" height="48" rx="6"/><text x="472" y="332" class="code">exit 1</text><text x="526" y="332" class="rose-text">stale: diff changed</text><text x="32" y="384" class="secondary">Any exit code but 0 blocks the merge. The AI drafts the receipt; only the named owner signs it.</text></svg>

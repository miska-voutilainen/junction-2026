<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 344" width="880" height="344" role="img" aria-labelledby="blind-first-t blind-first-d"><title id="blind-first-t">Anchored versus blind-first review order</title><desc id="blind-first-d">Two lanes with the same steps. Anchored: the author&#x27;s description is read first, A1 is skipped, then A2 and A4. Blind-first: the requirement first, A1 writes an expectation before any code, then A2, and A4 reads the description last. Each lane gets 15 chances to catch 5 planted false sentences; the counts are not measured yet.</desc><style>
.frame{fill:#0d0f12;stroke:#262c34;stroke-width:1}
.node{fill:#111418;stroke:#2a3038;stroke-width:1.5}
.node-acc{fill:#111418;stroke:#93aaff;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#111418;stroke:#e2b04a;stroke-width:1.5}
.tint-amber{fill:#e2b04a;fill-opacity:.12}
.node-rose{fill:#111418;stroke:#ef7a85;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#2a3038;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#9aa3af}
.title{font-size:13px;font-weight:600;fill:#e6e8eb}
.heading{font-size:14px;font-weight:600;fill:#e6e8eb}
.secondary{fill:#9aa3af}
.code{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#c4cad3}
.accent-text{fill:#93aaff}.rose-text{fill:#ef7a85}
.ln{stroke:#9aa3af;stroke-width:1.5;fill:none}
.la{stroke:#93aaff;stroke-width:2;fill:none}
.lr{stroke:#ef7a85;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head-neutral{fill:#9aa3af}.head-accent{fill:#93aaff}.head-rose{fill:#ef7a85}
.badge-dot{fill:#3558e8}.badge-number{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#ef7a85;stroke-width:1.5}
</style><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-neutral"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-rose"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="343" rx="8"/><text x="32" y="40" class="heading">Anchored: the description first</text><rect class="node" x="32" y="56" width="140" height="64" rx="6"/><text x="46" y="84.5" class="title">Author&#x27;s</text><text x="46" y="102.5" class="secondary">description, read first</text><path class="ln" d="M174,88 L198,88" marker-end="url(#ah-neutral)"/><rect class="node-dash" x="201" y="56" width="140" height="64" rx="6"/><text x="215" y="84.5" class="title">A1 skipped</text><text x="215" y="102.5" class="secondary">no expectation</text><path class="ln" d="M343,88 L367,88" marker-end="url(#ah-neutral)"/><rect class="node" x="370" y="56" width="140" height="64" rx="6"/><text x="384" y="84.5" class="title">A2 story</text><text x="384" y="102.5" class="secondary">and claims</text><path class="ln" d="M512,88 L536,88" marker-end="url(#ah-neutral)"/><rect class="node" x="539" y="56" width="140" height="64" rx="6"/><text x="553" y="84.5" class="title">A4 checks</text><text x="553" y="102.5" class="secondary">the description</text><path class="ln" d="M681,88 L705,88" marker-end="url(#ah-neutral)"/><rect class="node" x="708" y="56" width="140" height="64" rx="6"/><text x="722" y="84.5" class="title">caught x of 15</text><text x="722" y="102.5" class="secondary">not measured yet</text><text x="32" y="180" class="heading">Blind-first: Countersign&#x27;s order</text><rect class="node-acc" x="32" y="196" width="140" height="64" rx="6"/><text x="46" y="224.5" class="title">Requirement</text><text x="46" y="242.5" class="secondary">read first</text><path class="la" d="M174,228 L198,228" marker-end="url(#ah-accent)"/><rect class="node-acc" x="201" y="196" width="140" height="64" rx="6"/><text x="215" y="224.5" class="title">A1 expectation</text><text x="215" y="242.5" class="secondary">before any code</text><path class="la" d="M343,228 L367,228" marker-end="url(#ah-accent)"/><rect class="node-acc" x="370" y="196" width="140" height="64" rx="6"/><text x="384" y="224.5" class="title">A2 story</text><text x="384" y="242.5" class="secondary">and claims</text><path class="la" d="M512,228 L536,228" marker-end="url(#ah-accent)"/><rect class="node-acc" x="539" y="196" width="140" height="64" rx="6"/><text x="553" y="224.5" class="title">A4 checks the</text><text x="553" y="242.5" class="secondary">description, read last</text><path class="la" d="M681,228 L705,228" marker-end="url(#ah-accent)"/><rect class="node-acc" x="708" y="196" width="140" height="64" rx="6"/><text x="722" y="224.5" class="title">caught y of 15</text><text x="722" y="242.5" class="secondary">not measured yet</text><text x="32" y="300" class="secondary">Same reviewer, same 5 planted false sentences, 3 runs per mode: 15 chances to catch them in each lane.</text><text x="32" y="320" class="secondary">A plant is caught when A4 marks the planted sentence contradicted or unsupported.</text></svg>

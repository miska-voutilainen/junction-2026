<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 314" width="880" height="314" role="img" aria-labelledby="quote-check-t quote-check-d"><title id="quote-check-t">Mechanical quote check</title><desc id="quote-check-d">A claim&#x27;s citation and the cited lines are normalised the same way, then the quote is searched for in the cited lines. Found: the claim is Supported. Not found: the claim is Unverified and shown without citations; an area-review finding with no passing citation is dropped. Every failure is counted.</desc><style>
.frame{fill:#ffffff;stroke:#d8dee4;stroke-width:1}
.node{fill:#f6f8fa;stroke:#c9d1d9;stroke-width:1.5}
.node-acc{fill:#f6f8fa;stroke:#2f4fd6;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#f6f8fa;stroke:#8a5a00;stroke-width:1.5}
.tint-amber{fill:#8a5a00;fill-opacity:.12}
.node-rose{fill:#f6f8fa;stroke:#c4232e;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#c9d1d9;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#59636e}
.title{font-size:13px;font-weight:600;fill:#1f2328}
.heading{font-size:14px;font-weight:600;fill:#1f2328}
.secondary{fill:#59636e}
.code{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#3d444d}
.accent-text{fill:#2f4fd6}.rose-text{fill:#c4232e}
.ln{stroke:#59636e;stroke-width:1.5;fill:none}
.la{stroke:#2f4fd6;stroke-width:2;fill:none}
.lr{stroke:#c4232e;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head-neutral{fill:#59636e}.head-accent{fill:#2f4fd6}.head-rose{fill:#c4232e}
.badge-dot{fill:#3558e8}.badge-number{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#c4232e;stroke-width:1.5}
</style><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-neutral"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-rose"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="313" rx="8"/><rect class="node" x="32" y="48" width="180" height="72" rx="6"/><text x="46" y="72" class="title">A claim cites code</text><text x="46" y="90" class="code">file · side · lines</text><text x="46" y="107" class="code">quote</text><path class="ln" d="M214,84 L249,84" marker-end="url(#ah-neutral)"/><rect class="node" x="252" y="48" width="200" height="72" rx="6"/><text x="266" y="72" class="title">Normalise both</text><text x="266" y="90" class="secondary">the quote and the cited</text><text x="266" y="107" class="secondary">lines, the same way</text><path class="ln" d="M454,84 L489,84" marker-end="url(#ah-neutral)"/><rect class="node" x="492" y="48" width="170" height="72" rx="6"/><text x="506" y="80.5" class="title">Quote found in</text><text x="506" y="98.5" class="secondary">the cited lines?</text><path class="la" d="M664,84 L709,84" marker-end="url(#ah-accent)"/><text x="686" y="76" class="accent-text" text-anchor="middle">yes</text><rect class="node-acc" x="712" y="48" width="136" height="72" rx="6"/><rect class="tint-acc" x="712" y="48" width="136" height="72" rx="6"/><text x="780" y="80" class="title" text-anchor="middle">Supported</text><text x="780" y="98" class="secondary" text-anchor="middle">shown with quote</text><path class="lr" d="M577,122 L577,178" marker-end="url(#ah-rose)"/><text x="589" y="152" class="rose-text">no</text><rect class="node-rose" x="492" y="182" width="356" height="64" rx="6"/><text x="508" y="208" class="title">Unverified: shown without citations</text><text x="508" y="226" class="secondary">A3 findings with no passing citation are dropped.</text><text x="32" y="176" class="title">Normalising</text><text x="32" y="198" class="code">\r\n  →  \n</text><text x="32" y="216" class="code">whitespace runs  →  one space</text><text x="32" y="234" class="code">trim; case stays significant</text><text x="32" y="290" class="secondary">Every failure is counted: quotes checked, quote failures, findings dropped. No model call.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 296" width="880" height="296" role="img" aria-labelledby="separation-of-duties-t separation-of-duties-d"><title id="separation-of-duties-t">The author never checks its own work</title><desc id="separation-of-duties-d">Three roles left to right: the authoring agent writes the code and its own tests, and its test makes a claim Supported at most; the AI reviewer checks the claims and drafts the receipt, and never signs; a named person reads what is left and signs, and only a person&#x27;s key makes the receipt valid. Whoever plants the measuring bugs never sees the reviewer&#x27;s prompts.</desc><style>
.frame{fill:#ffffff;stroke:#d8dee4;stroke-width:1}
.node{fill:#f6f8fa;stroke:#c9d1d9;stroke-width:1.5}
.node-acc{fill:#f6f8fa;stroke:#2f4fd6;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#f6f8fa;stroke:#8a5a00;stroke-width:1.5}
.tint-amber{fill:#8a5a00;fill-opacity:.12}
.node-rose{fill:#f6f8fa;stroke:#c4232e;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#c9d1d9;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#59636e}
.title{font-size:13px;font-weight:600;fill:#1f2328}
.heading{font-size:14px;font-weight:600;fill:#1f2328}
.secondary{fill:#59636e}
.code{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#3d444d}
.accent-text{fill:#2f4fd6}.rose-text{fill:#c4232e}
.ln{stroke:#59636e;stroke-width:1.5;fill:none}
.la{stroke:#2f4fd6;stroke-width:2;fill:none}
.lr{stroke:#c4232e;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head-neutral{fill:#59636e}.head-accent{fill:#2f4fd6}.head-rose{fill:#c4232e}
.badge-dot{fill:#3558e8}.badge-number{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#c4232e;stroke-width:1.5}
</style><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-neutral"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-rose"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="295" rx="8"/><text x="32" y="34" class="heading">Three different roles on every change</text><rect class="node" x="32" y="56" width="240" height="72" rx="6"/><text x="46" y="80" class="title">Authoring agent</text><text x="46" y="98" class="secondary">writes the code</text><text x="46" y="115" class="secondary">and its own tests</text><path class="la" d="M274,92 L309,92" marker-end="url(#ah-accent)"/><text x="32" y="168" class="secondary">The rule</text><text x="32" y="188" class="title">Its test makes a claim</text><text x="32" y="206" class="title">Supported at most</text><rect class="node" x="312" y="56" width="240" height="72" rx="6"/><text x="326" y="80" class="title">AI reviewer</text><text x="326" y="98" class="secondary">checks the claims,</text><text x="326" y="115" class="secondary">drafts the receipt</text><path class="la" d="M554,92 L589,92" marker-end="url(#ah-accent)"/><text x="312" y="168" class="secondary">The rule</text><text x="312" y="188" class="title">Never signs</text><text x="312" y="206" class="title">and never sees the answer keys</text><rect class="node-acc" x="592" y="56" width="240" height="72" rx="6"/><text x="606" y="80" class="title">Named person</text><text x="606" y="98" class="secondary">reads what is left</text><text x="606" y="115" class="secondary">and signs with their key</text><text x="592" y="168" class="secondary">The rule</text><text x="592" y="188" class="title">Only a person&#x27;s key</text><text x="592" y="206" class="title">makes the receipt valid</text><text x="32" y="270" class="secondary">Whoever plants the bugs that measure the reviewer never sees its prompts.</text></svg>

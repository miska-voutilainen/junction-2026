<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img" aria-labelledby="trust-ladder-t trust-ladder-d"><title id="trust-ladder-t">Trust ladder: Shadow, Calibrated, Trusted</title><desc id="trust-ladder-d">Three rising steps. Shadow: fewer than 3 planted bugs or a catch rate under 60%, the AI routes nothing. Calibrated: at least 60% caught of at least 3, fewer than 5 clean spot checks, routes Focused at best. Trusted: 5 or more clean spot checks, can route Light. Evidence moves an area up; an escape moves it down one level.</desc><style>
.frame{fill:#ffffff;stroke:#d8dee4;stroke-width:1}
.node{fill:#f6f8fa;stroke:#c9d1d9;stroke-width:1.5}
.node-acc{fill:#f6f8fa;stroke:#2f4fd6;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#f6f8fa;stroke:#8a5a00;stroke-width:1.5}
.tint-amber{fill:#8a5a00;fill-opacity:.12}
.node-rose{fill:#f6f8fa;stroke:#c4232e;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#c9d1d9;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#59636e}
.t{font-size:13px;font-weight:600;fill:#1f2328}
.h{font-size:14px;font-weight:600;fill:#1f2328}
.s{fill:#59636e}
.c{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#3d444d}
.ta{fill:#2f4fd6}.tr{fill:#c4232e}
.ln{stroke:#59636e;stroke-width:1.5;fill:none}
.la{stroke:#2f4fd6;stroke-width:2;fill:none}
.lr{stroke:#c4232e;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fn{fill:#59636e}.fa{fill:#2f4fd6}.fr{fill:#c4232e}
.dot{fill:#3558e8}.dott{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#c4232e;stroke-width:1.5}
</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fn"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fr"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="383" rx="8"/><text x="32" y="34" class="s">One ladder per review area: generator, analyzer, security, performance</text><rect class="node" x="32" y="210" width="230" height="120" rx="6"/><text x="48" y="238" class="t">Shadow</text><text x="48" y="262" class="c">planted &lt; 3</text><text x="48" y="280" class="c">or caught &lt; 60%</text><text x="48" y="298" class="s">Runs, but routes nothing:</text><text x="48" y="316" class="s">a human reads every hunk</text><rect class="node-acc" x="325" y="150" width="230" height="180" rx="6"/><rect class="tint-acc" x="325" y="150" width="230" height="180" rx="6"/><text x="341" y="178" class="t">Calibrated</text><text x="341" y="202" class="c">caught ≥ 60% of ≥ 3</text><text x="341" y="220" class="c">clean spot checks &lt; 5</text><text x="341" y="238" class="s">Routes the change</text><text x="341" y="256" class="s">Focused at best</text><rect class="node-acc" x="618" y="90" width="230" height="240" rx="6"/><rect class="tint-acc2" x="618" y="90" width="230" height="240" rx="6"/><text x="634" y="118" class="t">Trusted</text><text x="634" y="142" class="c">clean spot checks ≥ 5</text><text x="634" y="160" class="s">Can route a change</text><text x="634" y="178" class="s">Light</text><path class="la" d="M266,240 L320,190" marker-end="url(#ah-a)"/><text x="293" y="180" class="ta" text-anchor="middle">evidence</text><path class="lr" d="M320,270 L268,270" marker-end="url(#ah-r)"/><text x="294" y="290" class="tr" text-anchor="middle">escape</text><path class="la" d="M559,180 L613,130" marker-end="url(#ah-a)"/><text x="586" y="120" class="ta" text-anchor="middle">evidence</text><path class="lr" d="M613,210 L561,210" marker-end="url(#ah-r)"/><text x="587" y="230" class="tr" text-anchor="middle">escape</text><text x="32" y="360" class="s">An area climbs on evidence and drops one level after each escape. People set the thresholds in src/policy/ladder.ts.</text></svg>

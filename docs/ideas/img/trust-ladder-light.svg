<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 384" width="880" height="384" role="img" aria-labelledby="trust-ladder-t trust-ladder-d"><title id="trust-ladder-t">Trust ladder: Shadow, Calibrated, Trusted</title><desc id="trust-ladder-d">Three rising steps. Shadow: fewer than 3 planted bugs or a catch rate under 60%, the AI routes nothing. Calibrated: at least 60% caught of at least 3, fewer than 5 clean spot checks, routes Focused at best. Trusted: 5 or more clean spot checks, can route Light. Evidence moves an area up; an escape moves it down one level.</desc><style>
.frame{fill:#ffffff;stroke:#d8dee4;stroke-width:1}
.node{fill:#f6f8fa;stroke:#c9d1d9;stroke-width:1.5}
.node-acc{fill:#f6f8fa;stroke:#2f4fd6;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#f6f8fa;stroke:#8a5a00;stroke-width:1.5}
.tint-amber{fill:#8a5a00;fill-opacity:.12}
.node-rose{fill:#f6f8fa;stroke:#c4232e;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#c9d1d9;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#59636e}
.title{font-size:13px;font-weight:600;fill:#1f2328}
.heading{font-size:14px;font-weight:600;fill:#1f2328}
.secondary{fill:#59636e}
.code{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#3d444d}
.accent-text{fill:#2f4fd6}.rose-text{fill:#c4232e}
.ln{stroke:#59636e;stroke-width:1.5;fill:none}
.la{stroke:#2f4fd6;stroke-width:2;fill:none}
.lr{stroke:#c4232e;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head-neutral{fill:#59636e}.head-accent{fill:#2f4fd6}.head-rose{fill:#c4232e}
.badge-dot{fill:#3558e8}.badge-number{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#c4232e;stroke-width:1.5}
</style><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-neutral"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-rose"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="383" rx="8"/><text x="32" y="34" class="secondary">One ladder per review area: generator, analyzer, security, performance</text><rect class="node" x="32" y="210" width="230" height="120" rx="6"/><text x="48" y="238" class="title">Shadow</text><text x="48" y="262" class="code">planted &lt; 3</text><text x="48" y="280" class="code">or caught &lt; 60%</text><text x="48" y="298" class="secondary">Runs, but routes nothing:</text><text x="48" y="316" class="secondary">a human reads every hunk</text><rect class="node-acc" x="325" y="150" width="230" height="180" rx="6"/><rect class="tint-acc" x="325" y="150" width="230" height="180" rx="6"/><text x="341" y="178" class="title">Calibrated</text><text x="341" y="202" class="code">caught ≥ 60% of ≥ 3</text><text x="341" y="220" class="code">clean spot checks &lt; 5</text><text x="341" y="238" class="secondary">Routes the change</text><text x="341" y="256" class="secondary">Focused at best</text><rect class="node-acc" x="618" y="90" width="230" height="240" rx="6"/><rect class="tint-acc2" x="618" y="90" width="230" height="240" rx="6"/><text x="634" y="118" class="title">Trusted</text><text x="634" y="142" class="code">clean spot checks ≥ 5</text><text x="634" y="160" class="secondary">Can route a change</text><text x="634" y="178" class="secondary">Light</text><path class="la" d="M266,240 L320,190" marker-end="url(#ah-accent)"/><text x="293" y="180" class="accent-text" text-anchor="middle">evidence</text><path class="lr" d="M320,270 L268,270" marker-end="url(#ah-rose)"/><text x="294" y="290" class="rose-text" text-anchor="middle">escape</text><path class="la" d="M559,180 L613,130" marker-end="url(#ah-accent)"/><text x="586" y="120" class="accent-text" text-anchor="middle">evidence</text><path class="lr" d="M613,210 L561,210" marker-end="url(#ah-rose)"/><text x="587" y="230" class="rose-text" text-anchor="middle">escape</text><text x="32" y="360" class="secondary">An area climbs on evidence and drops one level after each escape. People set the thresholds in src/policy/ladder.ts.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 314" width="880" height="314" role="img" aria-labelledby="quote-check-t quote-check-d"><title id="quote-check-t">Mechanical quote check</title><desc id="quote-check-d">A claim&#x27;s citation and the cited lines are normalised the same way, then the quote is searched for in the cited lines. Found: the claim is Supported. Not found: the claim is Unverified and shown without citations; a finding with no passing citation is dropped. Every failure is counted.</desc><style>
.frame{fill:#0d0f12;stroke:#262c34;stroke-width:1}
.node{fill:#111418;stroke:#2a3038;stroke-width:1.5}
.node-acc{fill:#111418;stroke:#93aaff;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#111418;stroke:#e2b04a;stroke-width:1.5}
.tint-amber{fill:#e2b04a;fill-opacity:.12}
.node-rose{fill:#111418;stroke:#ef7a85;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#2a3038;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#9aa3af}
.t{font-size:13px;font-weight:600;fill:#e6e8eb}
.h{font-size:14px;font-weight:600;fill:#e6e8eb}
.s{fill:#9aa3af}
.c{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#c4cad3}
.ta{fill:#93aaff}.tam{fill:#e2b04a}.tr{fill:#ef7a85}.tg{fill:#57c98b}
.ln{stroke:#9aa3af;stroke-width:1.5;fill:none}
.la{stroke:#93aaff;stroke-width:2;fill:none}
.lr{stroke:#ef7a85;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.lh{stroke:#262c34;stroke-width:1;fill:none}
.fn{fill:#9aa3af}.fa{fill:#93aaff}.fr{fill:#ef7a85}
.dot{fill:#3558e8}.dott{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#ef7a85;stroke-width:1.5}
</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fn"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fr"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="313" rx="8"/><rect class="node" x="32" y="48" width="180" height="72" rx="6"/><text x="46" y="72" class="t">A claim cites code</text><text x="46" y="90" class="c">file · side · lines</text><text x="46" y="107" class="c">quote</text><path class="ln" d="M214,84 L249,84" marker-end="url(#ah-n)"/><rect class="node" x="252" y="48" width="200" height="72" rx="6"/><text x="266" y="72" class="t">Normalise both</text><text x="266" y="90" class="s">the quote and the cited</text><text x="266" y="107" class="s">lines, the same way</text><path class="ln" d="M454,84 L489,84" marker-end="url(#ah-n)"/><rect class="node" x="492" y="48" width="170" height="72" rx="6"/><text x="506" y="80.5" class="t">Quote found in</text><text x="506" y="98.5" class="s">the cited lines?</text><path class="la" d="M664,84 L709,84" marker-end="url(#ah-a)"/><text x="686" y="76" class="ta" text-anchor="middle">yes</text><rect class="node-acc" x="712" y="48" width="136" height="72" rx="6"/><rect class="tint-acc" x="712" y="48" width="136" height="72" rx="6"/><text x="780" y="80" class="t" text-anchor="middle">Supported</text><text x="780" y="98" class="s" text-anchor="middle">shown with quote</text><path class="lr" d="M577,122 L577,178" marker-end="url(#ah-r)"/><text x="589" y="152" class="tr">no</text><rect class="node-rose" x="492" y="182" width="356" height="64" rx="6"/><text x="508" y="208" class="t">Unverified: shown without citations</text><text x="508" y="226" class="s">A finding with no passing citation is dropped.</text><text x="32" y="176" class="t">Normalising</text><text x="32" y="198" class="c">\r\n  →  \n</text><text x="32" y="216" class="c">whitespace runs  →  one space</text><text x="32" y="234" class="c">trim; case stays significant</text><text x="32" y="290" class="s">Every failure is counted: quotes checked, quote failures, claims downgraded, findings dropped. No model call.</text></svg>

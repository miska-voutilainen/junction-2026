<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" width="880" height="348" role="img" aria-labelledby="ideas-overview-t ideas-overview-d"><title id="ideas-overview-t">The eight ideas along one pull request</title><desc id="ideas-overview-d">Six stages left to right: expectation from the requirement (idea 2), claims that cite code (idea 4), refusals (idea 5), tests on base and head (idea 6), route() coverage per hunk (idea 3), the owner signs a git note (idea 7). The trust ladder (idea 1), measured offline on planted bugs, feeds route(). Idea 8, the author never checks its own work, runs through all of it.</desc><style>
.frame{fill:#0d0f12;stroke:#262c34;stroke-width:1}
.node{fill:#111418;stroke:#2a3038;stroke-width:1.5}
.node-acc{fill:#111418;stroke:#93aaff;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#111418;stroke:#e2b04a;stroke-width:1.5}
.tint-amber{fill:#e2b04a;fill-opacity:.12}
.node-rose{fill:#111418;stroke:#ef7a85;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#2a3038;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#9aa3af}
.t{font-size:13px;font-weight:600;fill:#e6e8eb}
.h{font-size:14px;font-weight:600;fill:#e6e8eb}
.s{fill:#9aa3af}
.c{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#c4cad3}
.ta{fill:#93aaff}.tr{fill:#ef7a85}
.ln{stroke:#9aa3af;stroke-width:1.5;fill:none}
.la{stroke:#93aaff;stroke-width:2;fill:none}
.lr{stroke:#ef7a85;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fn{fill:#9aa3af}.fa{fill:#93aaff}.fr{fill:#ef7a85}
.dot{fill:#3558e8}.dott{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#ef7a85;stroke-width:1.5}
</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fn"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fr"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="347" rx="8"/><text x="32" y="34" class="h">One agent-written pull request, left to right</text><rect class="node" x="32" y="150" width="120" height="64" rx="6"/><text x="46" y="178.5" class="t">Expectation</text><text x="46" y="196.5" class="s">from the requirement</text><path class="la" d="M154,182 L168,182" marker-end="url(#ah-a)"/><circle class="dot" cx="54" cy="248" r="10"/><text x="54" y="252" class="dott" text-anchor="middle">2</text><text x="70" y="252" class="t">Blind-first</text><rect class="node" x="171" y="150" width="120" height="64" rx="6"/><text x="185" y="178.5" class="t">Claims</text><text x="185" y="196.5" class="s">cite the code</text><path class="la" d="M293,182 L307,182" marker-end="url(#ah-a)"/><circle class="dot" cx="193" cy="248" r="10"/><text x="193" y="252" class="dott" text-anchor="middle">4</text><text x="209" y="252" class="t">Quote check</text><rect class="node" x="310" y="150" width="120" height="64" rx="6"/><text x="324" y="178.5" class="t">Refusals</text><text x="324" y="196.5" class="s">7 written rules</text><path class="la" d="M432,182 L446,182" marker-end="url(#ah-a)"/><circle class="dot" cx="332" cy="248" r="10"/><text x="332" y="252" class="dott" text-anchor="middle">5</text><text x="348" y="252" class="t">Refusal policy</text><rect class="node" x="449" y="150" width="120" height="64" rx="6"/><text x="463" y="178.5" class="t">Tests on</text><text x="463" y="196.5" class="s">base and head</text><path class="la" d="M571,182 L585,182" marker-end="url(#ah-a)"/><circle class="dot" cx="471" cy="248" r="10"/><text x="471" y="252" class="dott" text-anchor="middle">6</text><text x="487" y="252" class="t">Evidence levels</text><rect class="node" x="588" y="150" width="120" height="64" rx="6"/><text x="602" y="178.5" class="t">route()</text><text x="602" y="196.5" class="s">coverage per hunk</text><path class="la" d="M710,182 L724,182" marker-end="url(#ah-a)"/><circle class="dot" cx="610" cy="248" r="10"/><text x="610" y="252" class="dott" text-anchor="middle">3</text><text x="626" y="252" class="t">Coverage map</text><rect class="node-acc" x="727" y="150" width="120" height="64" rx="6"/><text x="741" y="178.5" class="t">Owner signs</text><text x="741" y="196.5" class="s">a git note</text><circle class="dot" cx="749" cy="248" r="10"/><text x="749" y="252" class="dott" text-anchor="middle">7</text><text x="765" y="252" class="t">Signed receipt</text><rect class="node-amber" x="449" y="56" width="259" height="52" rx="6"/><rect class="tint-amber" x="449" y="56" width="259" height="52" rx="6"/><text x="463" y="78.5" class="t">Trust ladder per area</text><text x="463" y="96.5" class="s">planted bugs, measured offline</text><path class="ln" d="M648,110 L648,147" marker-end="url(#ah-n)"/><circle class="dot" cx="423" cy="82" r="10"/><text x="423" y="86" class="dott" text-anchor="middle">1</text><text x="32" y="296" class="s">Ideas 2, 4, 5 and 6 build the evidence; 1 and 3 decide what a person reads; 7 makes the person accountable.</text><circle class="dot" cx="42" cy="322" r="10"/><text x="42" y="326" class="dott" text-anchor="middle">8</text><text x="58" y="326" class="s">Idea 8 runs through all of it: the author never checks its own work.</text></svg>

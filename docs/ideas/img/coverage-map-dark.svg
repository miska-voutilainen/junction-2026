<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-labelledby="coverage-map-t coverage-map-d"><title id="coverage-map-t">Hunk coverage: first match wins</title><desc id="coverage-map-d">Each hunk is checked in order. If a finding or refusal lists it, its area is at Shadow, or no Verified or Supported claim lists it, it is Read this. Else if a Verified claim lists it, it is Verified. Otherwise it is Supported.</desc><style>
.frame{fill:#0d0f12;stroke:#262c34;stroke-width:1}
.node{fill:#111418;stroke:#2a3038;stroke-width:1.5}
.node-acc{fill:#111418;stroke:#93aaff;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#111418;stroke:#e2b04a;stroke-width:1.5}
.tint-amber{fill:#e2b04a;fill-opacity:.12}
.node-rose{fill:#111418;stroke:#ef7a85;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#2a3038;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#9aa3af}
.title{font-size:13px;font-weight:600;fill:#e6e8eb}
.heading{font-size:14px;font-weight:600;fill:#e6e8eb}
.secondary{fill:#9aa3af}
.code{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#c4cad3}
.accent-text{fill:#93aaff}.rose-text{fill:#ef7a85}
.ln{stroke:#9aa3af;stroke-width:1.5;fill:none}
.la{stroke:#93aaff;stroke-width:2;fill:none}
.lr{stroke:#ef7a85;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.head-neutral{fill:#9aa3af}.head-accent{fill:#93aaff}.head-rose{fill:#ef7a85}
.badge-dot{fill:#3558e8}.badge-number{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#ef7a85;stroke-width:1.5}
</style><defs><marker id="ah-neutral" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-neutral"/></marker><marker id="ah-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-accent"/></marker><marker id="ah-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="head-rose"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="451" rx="8"/><rect class="node" x="32" y="24" width="120" height="32" rx="16"/><text x="92" y="45" class="title" text-anchor="middle">Each hunk</text><path class="ln" d="M56,56 L56,77" marker-end="url(#ah-neutral)"/><rect class="node" x="32" y="80" width="400" height="44" rx="6"/><text x="48" y="107" class="title">A finding or a refusal lists it?</text><path class="ln" d="M56,124 L56,141" marker-end="url(#ah-neutral)"/><text x="66" y="138" class="secondary">no</text><rect class="node" x="32" y="144" width="400" height="44" rx="6"/><text x="48" y="171" class="title">Its area is at Shadow on the ladder?</text><path class="ln" d="M56,188 L56,205" marker-end="url(#ah-neutral)"/><text x="66" y="202" class="secondary">no</text><rect class="node" x="32" y="208" width="400" height="44" rx="6"/><text x="48" y="235" class="title">No Verified or Supported claim lists it?</text><path class="ln" d="M56,252 L56,269" marker-end="url(#ah-neutral)"/><text x="66" y="266" class="secondary">no</text><rect class="node" x="32" y="272" width="400" height="44" rx="6"/><text x="48" y="299" class="title">A Verified claim lists it?</text><path class="ln" d="M56,316 L56,333" marker-end="url(#ah-neutral)"/><text x="66" y="330" class="secondary">no</text><rect class="node-amber" x="560" y="80" width="288" height="172" rx="6"/><rect class="tint-amber" x="560" y="80" width="288" height="172" rx="6"/><text x="580" y="156" class="title">Read this</text><text x="580" y="176" class="secondary">A person reads the hunk.</text><path class="ln" d="M432,102 L557,102" marker-end="url(#ah-neutral)"/><text x="496" y="96" class="secondary" text-anchor="middle">yes</text><path class="ln" d="M432,166 L557,166" marker-end="url(#ah-neutral)"/><text x="496" y="160" class="secondary" text-anchor="middle">yes</text><path class="ln" d="M432,230 L557,230" marker-end="url(#ah-neutral)"/><text x="496" y="224" class="secondary" text-anchor="middle">yes</text><rect class="node-acc" x="560" y="272" width="288" height="44" rx="6"/><rect class="tint-acc2" x="560" y="272" width="288" height="44" rx="6"/><text x="580" y="299" class="title">Verified</text><text x="650" y="299" class="secondary">a test tells base and head apart</text><path class="la" d="M432,294 L557,294" marker-end="url(#ah-accent)"/><text x="496" y="288" class="accent-text" text-anchor="middle">yes</text><rect class="node-dash" x="32" y="336" width="400" height="44" rx="6"/><text x="48" y="363" class="title">Otherwise</text><rect class="node-acc" x="560" y="336" width="288" height="44" rx="6"/><rect class="tint-acc" x="560" y="336" width="288" height="44" rx="6"/><text x="580" y="363" class="title">Supported</text><text x="660" y="363" class="secondary">a quoted citation matched</text><path class="ln" d="M432,358 L557,358" marker-end="url(#ah-neutral)"/><text x="32" y="412" class="secondary">First match wins. Then the tier rules (R-size to R-unread) set the change to Light, Focused or Full,</text><text x="32" y="430" class="secondary">and the reviewer sees one line: Read r of n hunks.</text></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" role="img" aria-labelledby="coverage-map-t coverage-map-d"><title id="coverage-map-t">Hunk coverage: first match wins</title><desc id="coverage-map-d">Each hunk is checked in order. If a finding or refusal lists it, its area is at Shadow, or no Verified or Supported claim lists it, it is Read this. Else if a Verified claim lists it, it is Verified. Otherwise it is Supported.</desc><style>
.frame{fill:#ffffff;stroke:#d8dee4;stroke-width:1}
.node{fill:#f6f8fa;stroke:#c9d1d9;stroke-width:1.5}
.node-acc{fill:#f6f8fa;stroke:#2f4fd6;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#f6f8fa;stroke:#8a5a00;stroke-width:1.5}
.tint-amber{fill:#8a5a00;fill-opacity:.12}
.node-rose{fill:#f6f8fa;stroke:#c4232e;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#c9d1d9;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#59636e}
.t{font-size:13px;font-weight:600;fill:#1f2328}
.h{font-size:14px;font-weight:600;fill:#1f2328}
.s{fill:#59636e}
.c{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#3d444d}
.ta{fill:#2f4fd6}.tam{fill:#8a5a00}.tr{fill:#c4232e}.tg{fill:#1a7f37}
.ln{stroke:#59636e;stroke-width:1.5;fill:none}
.la{stroke:#2f4fd6;stroke-width:2;fill:none}
.lr{stroke:#c4232e;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.lh{stroke:#d8dee4;stroke-width:1;fill:none}
.fn{fill:#59636e}.fa{fill:#2f4fd6}.fr{fill:#c4232e}
.dot{fill:#3558e8}.dott{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#c4232e;stroke-width:1.5}
</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fn"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fr"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="451" rx="8"/><rect class="node" x="32" y="24" width="120" height="32" rx="16"/><text x="92" y="45" class="t" text-anchor="middle">Each hunk</text><path class="ln" d="M56,56 L56,77" marker-end="url(#ah-n)"/><rect class="node" x="32" y="80" width="400" height="44" rx="6"/><text x="48" y="107" class="t">A finding or a refusal lists it?</text><path class="ln" d="M56,124 L56,141" marker-end="url(#ah-n)"/><text x="66" y="138" class="s">no</text><rect class="node" x="32" y="144" width="400" height="44" rx="6"/><text x="48" y="171" class="t">Its area is at Shadow on the ladder?</text><path class="ln" d="M56,188 L56,205" marker-end="url(#ah-n)"/><text x="66" y="202" class="s">no</text><rect class="node" x="32" y="208" width="400" height="44" rx="6"/><text x="48" y="235" class="t">No Verified or Supported claim lists it?</text><path class="ln" d="M56,252 L56,269" marker-end="url(#ah-n)"/><text x="66" y="266" class="s">no</text><rect class="node" x="32" y="272" width="400" height="44" rx="6"/><text x="48" y="299" class="t">A Verified claim lists it?</text><path class="ln" d="M56,316 L56,333" marker-end="url(#ah-n)"/><text x="66" y="330" class="s">no</text><rect class="node-amber" x="560" y="80" width="288" height="172" rx="6"/><rect class="tint-amber" x="560" y="80" width="288" height="172" rx="6"/><text x="580" y="156" class="t">Read this</text><text x="580" y="176" class="s">A person reads the hunk.</text><path class="ln" d="M432,102 L557,102" marker-end="url(#ah-n)"/><text x="496" y="96" class="s" text-anchor="middle">yes</text><path class="ln" d="M432,166 L557,166" marker-end="url(#ah-n)"/><text x="496" y="160" class="s" text-anchor="middle">yes</text><path class="ln" d="M432,230 L557,230" marker-end="url(#ah-n)"/><text x="496" y="224" class="s" text-anchor="middle">yes</text><rect class="node-acc" x="560" y="272" width="288" height="44" rx="6"/><rect class="tint-acc2" x="560" y="272" width="288" height="44" rx="6"/><text x="580" y="299" class="t">Verified</text><text x="650" y="299" class="s">a test tells base and head apart</text><path class="la" d="M432,294 L557,294" marker-end="url(#ah-a)"/><text x="496" y="288" class="ta" text-anchor="middle">yes</text><rect class="node-dash" x="32" y="336" width="400" height="44" rx="6"/><text x="48" y="363" class="t">Otherwise</text><rect class="node-acc" x="560" y="336" width="288" height="44" rx="6"/><rect class="tint-acc" x="560" y="336" width="288" height="44" rx="6"/><text x="580" y="363" class="t">Supported</text><text x="660" y="363" class="s">a quoted citation matched</text><path class="ln" d="M432,358 L557,358" marker-end="url(#ah-n)"/><text x="32" y="412" class="s">First match wins. Then the tier rules (R-size to R-unread) set the change to Light, Focused or Full,</text><text x="32" y="430" class="s">and the reviewer sees one line: Read r of n hunks.</text></svg>

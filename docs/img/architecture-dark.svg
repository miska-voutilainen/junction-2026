<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 532" width="880" height="532" role="img" aria-labelledby="architecture-t architecture-d"><title id="architecture-t">Countersign architecture</title><desc id="architecture-d">A laptop half runs the review pipeline (P2) over our fork of Tieto&#x27;s repository (P1), with the Claude model and the .NET SDK, plus the planted-bug eval (P4) and the receipt CLI (P5). It writes committed files into data/. A static site on Vercel with no server and no database, the review app (P6) with simulated escapes in browser storage, reads those files. The routing rules (P3, no AI) are imported by the pipeline and re-run in the browser.</desc><style>
.frame{fill:#0d0f12;stroke:#262c34;stroke-width:1}
.node{fill:#111418;stroke:#2a3038;stroke-width:1.5}
.node-acc{fill:#111418;stroke:#93aaff;stroke-width:1.5}
.tint-acc{fill:#3558e8;fill-opacity:.16}
.tint-acc2{fill:#3558e8;fill-opacity:.24}
.node-amber{fill:#111418;stroke:#e2b04a;stroke-width:1.5}
.tint-amber{fill:#e2b04a;fill-opacity:.12}
.node-rose{fill:#111418;stroke:#ef7a85;stroke-width:1.5;stroke-dasharray:5 4}
.node-dash{fill:none;stroke:#2a3038;stroke-width:1.5;stroke-dasharray:5 4}
text{font-family:-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif;font-size:12px;fill:#9aa3af}
.t{font-size:13px;font-weight:600;fill:#e6e8eb}
.h{font-size:14px;font-weight:600;fill:#e6e8eb}
.s{fill:#9aa3af}
.c{font-family:ui-monospace, SFMono-Regular, &quot;SF Mono&quot;, Menlo, Consolas, &quot;Liberation Mono&quot;, monospace;fill:#c4cad3}
.ta{fill:#93aaff}.tr{fill:#ef7a85}
.ln{stroke:#9aa3af;stroke-width:1.5;fill:none}
.la{stroke:#93aaff;stroke-width:2;fill:none}
.lr{stroke:#ef7a85;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
.fn{fill:#9aa3af}.fa{fill:#93aaff}.fr{fill:#ef7a85}
.dot{fill:#3558e8}.dott{fill:#ffffff;font-size:12px;font-weight:600}
.strike{stroke:#ef7a85;stroke-width:1.5}
</style><defs><marker id="ah-n" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fn"/></marker><marker id="ah-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fa"/></marker><marker id="ah-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="fr"/></marker></defs><rect class="frame" x="0.5" y="0.5" width="879" height="531" rx="8"/><rect class="node-dash" x="32" y="16" width="816" height="196" rx="8"/><text x="48" y="38" class="h">Laptop (operator&#x27;s machine)</text><rect class="node" x="48" y="50" width="170" height="64" rx="6"/><text x="62" y="70" class="t">P1 · Demo data</text><text x="62" y="88" class="s">our fork of Tieto&#x27;s repo</text><text x="62" y="105" class="c">+ data/sample</text><rect class="node" x="242" y="50" width="262" height="64" rx="6"/><text x="256" y="78.5" class="t">P2 · Review pipeline</text><text x="256" y="96.5" class="s">A1–A5, quote check, .NET tests</text><rect class="node" x="524" y="50" width="150" height="64" rx="6"/><text x="538" y="78.5" class="t">P4 · Measurement</text><text x="538" y="96.5" class="s">planted-bug eval</text><rect class="node" x="694" y="50" width="138" height="64" rx="6"/><text x="708" y="70" class="t">P5 · Receipt CLI</text><text x="708" y="88" class="c">ssh-keygen</text><text x="708" y="105" class="s">+ git notes</text><path class="ln" d="M220,82 L239,82" marker-end="url(#ah-n)"/><path class="ln" d="M506,82 L521,82" marker-end="url(#ah-n)"/><path class="ln" d="M312,114 L312,140"/><path class="ln" d="M440,114 L440,140"/><rect class="node" x="242" y="140" width="140" height="52" rx="6"/><text x="256" y="154" class="t">Claude</text><text x="256" y="172" class="c">claude-opus-5-5</text><text x="256" y="189" class="s">record / replay</text><rect class="node" x="392" y="140" width="112" height="52" rx="6"/><text x="406" y="162.5" class="t">.NET SDK</text><text x="406" y="180.5" class="c">8.0.4xx</text><path class="la" d="M300,214 L300,259" marker-end="url(#ah-a)"/><text x="312" y="242" class="s">writes JSON: pnpm review, evals, countersign</text><rect class="node-amber" x="32" y="262" width="608" height="60" rx="6"/><rect class="tint-amber" x="32" y="262" width="608" height="60" rx="6"/><text x="46" y="288.5" class="t">Committed files in data/</text><text x="46" y="306.5" class="c">runs · eval · receipts · recordings</text><rect class="node-acc" x="668" y="262" width="180" height="60" rx="6"/><rect class="tint-acc" x="668" y="262" width="180" height="60" rx="6"/><text x="682" y="288.5" class="t">P3 · Routing rules</text><text x="682" y="306.5" class="s">src/rules, no AI</text><path class="la" d="M758,260 L758,170 L516,170 L516,100 L506,100" marker-end="url(#ah-a)"/><text x="640" y="164" class="s" text-anchor="middle">imported by P2</text><rect class="node-dash" x="32" y="352" width="816" height="126" rx="8"/><text x="48" y="374" class="h">Static site on Vercel (no server, no database)</text><path class="la" d="M480,324 L480,383" marker-end="url(#ah-a)"/><text x="468" y="346" class="s" text-anchor="end">read when the site is built</text><rect class="node" x="48" y="386" width="540" height="76" rx="6"/><text x="62" y="412" class="t">P6 · Review app</text><text x="62" y="430" class="s">S1 inbox · S2 review · S3 report card</text><text x="62" y="447" class="s">S4 receipt · S5 dashboard</text><rect class="node" x="612" y="386" width="220" height="76" rx="6"/><text x="626" y="420.5" class="t">Simulated escapes</text><text x="626" y="438.5" class="s">browser storage</text><path class="ln" d="M590,424 L610,424"/><path class="la" d="M740,324 L740,345 L560,345 L560,383" marker-end="url(#ah-a)"/><text x="650" y="338" class="s" text-anchor="middle">re-run in the browser</text><text x="32" y="508" class="s">The halves meet only through committed files in data/. P3 is the same pure code on both sides.</text></svg>
